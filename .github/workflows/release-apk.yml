name: Publish signed APK
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure version and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Configure APK signing secrets"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*1000000+$2*1000+$3}')
          sed -i "s/versionCode = 1/versionCode = $VERSION_CODE/; s/versionName = \"0.1.0\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          cat >> app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("releaseSigning") {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/release.keystore")
                      storePassword = System.getenv("APK_STORE_PASSWORD")
                      keyAlias = System.getenv("APK_KEY_ALIAS")
                      keyPassword = System.getenv("APK_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("releaseSigning")
                  }
              }
          }
          EOF
          echo "APK_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "APK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "APK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --title "$GITHUB_REF_NAME" --generate-notes
