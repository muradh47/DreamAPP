name: Publish Dream IPTV OpenTV beta
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GPL OpenTV upstream
        uses: actions/checkout@v4
        with:
          repository: opentvproject/opentv
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools" 
      - name: Configure Dream IPTV candidate
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dream.keystore"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "app.opentv"', 'applicationId = "com.monkeyiptv.player"')
          s = s.replace('versionCode = 20', 'versionCode = ' + str(2000000 + int(os.environ["GITHUB_RUN_NUMBER"])))
          s = s.replace('versionName = "0.11.8"', 'versionName = "0.2.' + os.environ["GITHUB_RUN_NUMBER"] + '"')
          p.write_text(s)
          manifest = Path("app/src/main/AndroidManifest.xml")
          t = manifest.read_text().replace('android:screenOrientation="fullUser"', 'android:screenOrientation="landscape"')
          manifest.write_text(t)
          for strings in Path("app/src/main/res").glob("values*/strings.xml"):
              text = strings.read_text()
              text = text.replace('>OpenTV</string>', '>Dream IPTV</string>')
              strings.write_text(text)
          # Brand the OpenTV setup as a username/password-only Xtream login.
          onboarding = Path("app/src/main/java/app/opentv/ui/onboarding/AddSourceScreen.kt")
          t = onboarding.read_text()
          t = t.replace('var usePhone by remember { mutableStateOf(isTelevision && editingSourceId == null) }', 'var usePhone by remember { mutableStateOf(false) }')
          t = t.replace('var kind by remember(existing?.id) { mutableStateOf(existing?.kind ?: SourceKind.XTREAM) }', 'var kind by remember(existing?.id) { mutableStateOf(SourceKind.XTREAM) }')
          t = t.replace('var url by remember(existing?.id) { mutableStateOf(existing?.url ?: "") }', 'var url by remember(existing?.id) { mutableStateOf("http://tvplug.xyz:8880") }')
          start = t.index('            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {')
          end = t.index('            if (kind == SourceKind.XTREAM) {', start)
          t = t[:start] + '            Text("Dream IPTV · Secure login", style = MaterialTheme.typography.titleMedium)\n            Spacer(Modifier.height(20.dp))\n\n' + t[end:]
          t = t.replace('url = url,', 'url = "http://tvplug.xyz:8880",')
          onboarding.write_text(t)
          # Preserve the original Dream IPTV home tile layout; OpenTV owns the other screens.
          main = Path("app/src/main/java/app/opentv/MainActivity.kt")
          t = main.read_text()
          t = t.replace('    const val HOME = "home"', '    const val HOME = "home"\n    const val BROWSE = "browse"')
          marker = '            composable(Routes.HOME) {\n                MainScreen('
          if marker not in t:
              raise RuntimeError("OpenTV navigation layout changed")
          t = t.replace(marker, '''            composable(Routes.HOME) {
                DreamHomeScreen(
                    onBrowse = { navController.navigate(Routes.BROWSE) },
                    onGuide = { navController.navigate(Routes.BROWSE) },
                    onUpdates = { navController.navigate(Routes.ABOUT) },
                    onLogout = { navController.navigate(Routes.PROVIDERS) },
                )
            }
            composable(Routes.BROWSE) {
                MainScreen(''', 1)
          t += r"""
          @Composable
          private fun DreamHomeScreen(
              onBrowse: () -> Unit,
              onGuide: () -> Unit,
              onUpdates: () -> Unit,
              onLogout: () -> Unit,
          ) {
              androidx.compose.foundation.layout.Column(
                  modifier = Modifier.fillMaxSize().background(Color(0xFF101827)).padding(20.dp),
              ) {
                  Text("DREAM IPTV", style = MaterialTheme.typography.headlineMedium, color = Color.White)
                  Text("Your entertainment, your way", color = Color.LightGray)
                  Spacer(Modifier.size(16.dp))
                  Row(Modifier.weight(1f)) {
            DreamTile("▣\nLIVE TV", Color(0xFF0094B5), Modifier.weight(1f).fillMaxSize(), onBrowse)
            androidx.compose.foundation.layout.Column(Modifier.weight(2f)) {
                Row(Modifier.weight(1f)) {
                    DreamTile("▶\nMOVIES", Color(0xFFDD4E27), Modifier.weight(1f).fillMaxSize(), onBrowse)
                    DreamTile("▤\nSERIES", Color(0xFF704DBB), Modifier.weight(1f).fillMaxSize(), onBrowse)
                }
                Row(Modifier.weight(0.6f)) {
                    DreamTile("TV GUIDE", Color(0xFF25866D), Modifier.weight(1f).fillMaxSize(), onGuide)
                    DreamTile("CATCH UP", Color(0xFF247861), Modifier.weight(1f).fillMaxSize(), onBrowse)
                }
            }
                  }
                  Row(Modifier.fillMaxSize().weight(0.28f)) {
            DreamTile("CHECK UPDATES", Color(0xFF263959), Modifier.weight(1f).fillMaxSize(), onUpdates)
            DreamTile("LOG OUT", Color(0xFF263959), Modifier.weight(1f).fillMaxSize(), onLogout)
                  }
              }
          }

          @Composable
          private fun DreamTile(
              label: String,
              color: Color,
              modifier: Modifier,
              onClick: () -> Unit,
          ) {
              Box(
                  modifier = modifier.padding(4.dp).clip(RoundedCornerShape(12.dp))
            .background(color).clickable(onClick = onClick),
                  contentAlignment = Alignment.Center,
              ) {
                  Text(label, color = Color.White, style = MaterialTheme.typography.titleLarge)
              }
          }
          """
          # Python triple-quoted strings turn \\n into actual newlines; Kotlin labels need escaped newlines.
          t = t.replace('DreamTile("▣\\nLIVE TV"', 'DreamTile("▣\\\\nLIVE TV"')
          t = t.replace('DreamTile("▶\\nMOVIES"', 'DreamTile("▶\\\\nMOVIES"')
          t = t.replace('DreamTile("▤\\nSERIES"', 'DreamTile("▤\\\\nSERIES"')
          main.write_text(t)
          # Redesign provider setup: Dream IPTV login instead of OpenTV onboarding.
          onboarding_code = onboarding.read_text()
          onboarding_code = onboarding_code.replace('var name by remember(existing?.id) { mutableStateOf(existing?.name ?: "") }', 'var name by remember(existing?.id) { mutableStateOf("Dream IPTV") }')
          onboarding_code = onboarding_code.replace('        name = name.ifBlank {', '        name = "Dream IPTV".ifBlank {')
          onboarding_code = onboarding_code.replace('                stringResource(\n                    if (existing != null) R.string.settings_edit_provider_title\n                    else R.string.onboarding_add_provider_title,\n                ),', '                "DREAM IPTV",')
          onboarding_code = onboarding_code.replace('                stringResource(R.string.onboarding_add_provider_desc),', '                "Welcome back. Sign in to start watching.",')
          onboarding_code = onboarding_code.replace('Text("Dream IPTV · Secure login", style = MaterialTheme.typography.titleMedium)', 'Text("YOUR ACCOUNT", style = MaterialTheme.typography.titleMedium, color = MaterialTheme.colorScheme.primary)')
          onboarding_code = onboarding_code.replace('Text(stringResource(R.string.onboarding_privacy_note),', 'Text("Your login is saved on this device. Connect securely to your IPTV provider.",')
          onboarding_code = onboarding_code.replace('Text(stringResource(R.string.onboarding_save_load))', 'Text("SIGN IN")')
          onboarding_code = onboarding_code.replace('else stringResource(R.string.onboarding_save_load)', 'else "SIGN IN"')
          onboarding_code = onboarding_code.replace('            .padding(32.dp),', '            .padding(horizontal = 32.dp, vertical = 20.dp),')
          onboarding_code = onboarding_code.replace('Column(Modifier.widthIn(max = 640.dp))', 'Column(Modifier.widthIn(max = 560.dp))')
          onboarding.write_text(onboarding_code)
          # Login must remain dark even when the phone's system theme is light.
          main_code = main.read_text()
          main_code = main_code.replace('OpenTvTheme(darkTheme = darkTheme)', 'OpenTvTheme(darkTheme = true)')
          main.write_text(main_code)
          # Connect Dream home tiles to their actual OpenTV content tabs.
          main_code = main.read_text()
          main_code = main_code.replace('const val BROWSE = "browse"', 'const val BROWSE = "browse/{section}"')
          main_code = main_code.replace('onBrowse = { navController.navigate(Routes.BROWSE) },', 'onBrowse = { section -> navController.navigate("browse/$section") },')
          main_code = main_code.replace('onGuide = { navController.navigate(Routes.BROWSE) },', 'onGuide = { navController.navigate("browse/live") },')
          main_code = main_code.replace('composable(Routes.BROWSE) {\n                MainScreen(', 'composable(Routes.BROWSE) { entry ->\n                MainScreen(\n                    initialSection = entry.arguments?.getString("section") ?: "live",')
          main_code = main_code.replace('onBrowse: () -> Unit,', 'onBrowse: (String) -> Unit,')
          for label, section in [('▣\\nLIVE TV', 'live'), ('▶\\nMOVIES', 'movies'), ('▤\\nSERIES', 'shows'), ('CATCH UP', 'live')]:
              main_code = main_code.replace('onBrowse)', 'onBrowse)', 1) if False else main_code
              main_code = main_code.replace('DreamTile("' + label, 'DreamTile("' + label)
          main_code = main_code.replace('Modifier.weight(1f).fillMaxSize(), onBrowse)', 'Modifier.weight(1f).fillMaxSize(), { onBrowse("live") })', 1)
          main_code = main_code.replace('Modifier.weight(1f).fillMaxSize(), onBrowse)', 'Modifier.weight(1f).fillMaxSize(), { onBrowse("movies") })', 1)
          main_code = main_code.replace('Modifier.weight(1f).fillMaxSize(), onBrowse)', 'Modifier.weight(1f).fillMaxSize(), { onBrowse("shows") })', 1)
          main_code = main_code.replace('Modifier.weight(1f).fillMaxSize(), onBrowse)', 'Modifier.weight(1f).fillMaxSize(), { onBrowse("live") })', 1)
          main.write_text(main_code)
          shell_code = shell.read_text() if False else Path("app/src/main/java/app/opentv/ui/MainScreen.kt").read_text()
          shell_code = shell_code.replace('fun MainScreen(\n    isTelevision:', 'fun MainScreen(\n    initialSection: String = "live",\n    isTelevision:')
          shell_code = shell_code.replace('var tab by remember { mutableStateOf(homeTab) }', 'var tab by remember(initialSection) { mutableStateOf(when (initialSection) { "movies" -> Tab.MOVIES; "shows" -> Tab.SHOWS; else -> Tab.LIVE }.takeIf { it in visibleTabs } ?: homeTab) }')
          Path("app/src/main/java/app/opentv/ui/MainScreen.kt").write_text(shell_code)
          # Point both automatic and manual updates at Dream IPTV releases, never OpenTV.
          checker = Path("app/src/main/java/app/opentv/update/UpdateChecker.kt")
          update_code = checker.read_text()
          if 'const val REPO_SLUG = "opentvproject/opentv"' not in update_code:
              raise RuntimeError("Upstream update source changed; refusing to ship OpenTV updater")
          update_code = update_code.replace('const val REPO_SLUG = "opentvproject/opentv"', 'const val REPO_SLUG = "muradh47/MonkeyIPTV"')
          update_code = update_code.replace('.header("User-Agent", "OpenTV")', '.header("User-Agent", "DreamIPTV")')
          checker.write_text(update_code)
          about = Path("app/src/main/java/app/opentv/ui/settings/AboutScreen.kt")
          about_code = about.read_text().replace('Text("OpenTV ${BuildConfig.VERSION_NAME}"', 'Text("Dream IPTV ${BuildConfig.VERSION_NAME}"')
          about.write_text(about_code)
          # Dream IPTV visual system applied across all OpenTV screens.
          theme = Path("app/src/main/java/app/opentv/ui/theme/Theme.kt")
          palette = theme.read_text()
          replacements = {
              "0xFF7C93FF": "0xFF00C8E8",
              "0xFF4B5DB8": "0xFF006E88",
              "0xFF9AA3C0": "0xFFFFB86C",
              "0xFF07080C": "0xFF0B1220",
              "0xFF0D0F16": "0xFF121E30",
              "0xFF171A24": "0xFF1B2B42",
              "0xFF2A2F3D": "0xFF334962",
              "0xFFE8EAF0": "0xFFF5F8FF",
              "0xFFA8AEC0": "0xFFB3C5DA",
              "0xFF3B4FCC": "0xFF008FAF",
              "0xFFFBFBFE": "0xFFEAF4FA",
              "0xFFEEF0F6": "0xFFD9E9F3",
              "fontSize = 34.sp": "fontSize = 38.sp",
              "fontSize = 26.sp": "fontSize = 30.sp",
              "fontSize = 22.sp": "fontSize = 25.sp",
              "fontSize = 20.sp": "fontSize = 23.sp",
              "fontSize = 17.sp": "fontSize = 19.sp",
          }
          for old, new in replacements.items():
              palette = palette.replace(old, new)
          theme.write_text(palette)
          # Bigger navigation rail for comfortable D-pad and TV use.
          shell = Path("app/src/main/java/app/opentv/ui/MainScreen.kt")
          shell_text = shell.read_text()
          shell_text = shell_text.replace("private val RAIL_COLLAPSED = 76.dp", "private val RAIL_COLLAPSED = 88.dp")
          shell_text = shell_text.replace("private val RAIL_EXPANDED = 236.dp", "private val RAIL_EXPANDED = 260.dp")
          shell.write_text(shell_text)
          PY
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dream.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compile signed migration candidate
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Publish OpenTV Dream IPTV beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.2.${GITHUB_RUN_NUMBER}"
          gh release create "v${VERSION}" app/build/outputs/apk/release/*.apk --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Dream IPTV OpenTV Beta v${VERSION}" --notes "OpenTV-based Dream IPTV beta built from master. GPL-3.0-or-later upstream opentvproject/opentv." --latest
