name: Validate OpenTV migration base
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenTV source
        uses: actions/checkout@v4
        with:
          repository: opentvproject/opentv
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build upstream baseline (not a Dream IPTV release)
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: opentv-upstream-debug-baseline
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
