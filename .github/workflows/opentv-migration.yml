name: Build Dream IPTV OpenTV migration candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GPL OpenTV upstream
        uses: actions/checkout@v4
        with:
          repository: opentvproject/opentv
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35" && test -d "$ANDROID_HOME/build-tools" 
      - name: Configure Dream IPTV candidate
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dream.keystore"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "app.opentv"', 'applicationId = "com.monkeyiptv.player"')
          s = s.replace('versionCode = 20', 'versionCode = ' + str(100000 + int(os.environ["GITHUB_RUN_NUMBER"])))
          s = s.replace('versionName = "0.11.8"', 'versionName = "0.2.' + os.environ["GITHUB_RUN_NUMBER"] + '"')
          p.write_text(s)
          manifest = Path("app/src/main/AndroidManifest.xml")
          t = manifest.read_text().replace('android:screenOrientation="fullUser"', 'android:screenOrientation="landscape"')
          manifest.write_text(t)
          for strings in Path("app/src/main/res").glob("values*/strings.xml"):
              text = strings.read_text()
              text = text.replace('>OpenTV</string>', '>Dream IPTV</string>')
              strings.write_text(text)
          # Brand the OpenTV setup as a username/password-only Xtream login.
          onboarding = Path("app/src/main/java/app/opentv/ui/onboarding/AddSourceScreen.kt")
          t = onboarding.read_text()
          t = t.replace('var usePhone by remember { mutableStateOf(isTelevision && editingSourceId == null) }', 'var usePhone by remember { mutableStateOf(false) }')
          t = t.replace('var kind by remember(existing?.id) { mutableStateOf(existing?.kind ?: SourceKind.XTREAM) }', 'var kind by remember(existing?.id) { mutableStateOf(SourceKind.XTREAM) }')
          t = t.replace('var url by remember(existing?.id) { mutableStateOf(existing?.url ?: "") }', 'var url by remember(existing?.id) { mutableStateOf("http://tvplug.xyz:8880") }')
          start = t.index('            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {')
          end = t.index('            if (kind == SourceKind.XTREAM) {', start)
          t = t[:start] + '            Text("Dream IPTV · Secure login", style = MaterialTheme.typography.titleMedium)\\n            Spacer(Modifier.height(20.dp))\\n\\n' + t[end:]
          t = t.replace('url = url,', 'url = "http://tvplug.xyz:8880",')
          onboarding.write_text(t)
          PY
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dream.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compile signed migration candidate
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Upload candidate for review (not a public beta release)
        uses: actions/upload-artifact@v4
        with:
          name: dream-iptv-opentv-migration-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
